#
# System-Info Configuration File
#
# Color settings support ANSI escape sequences:
#   \e[...m, \033[...m, or \x1b[...m
# Lines beginning with '#' are comments.

# Basic console colors:
color_basic                = \e[33m
color_network              = \e[34m
color_prefix               = \e[36m
color_inactive             = \e[37m
color_none                 = \e[0m

# Battery status colors:
color_battery_full         = \e[32m
color_battery_charging     = \e[33m
color_battery_not_charging = \e[38m
color_battery_discharging  = \e[35m

# Disk utilization threshold colors:
color_disk_normal          = \e[32m
color_disk_80percent       = \e[33m
color_disk_95percent       = \e[31m
