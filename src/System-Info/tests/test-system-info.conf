# System-Info Test Configuration File
# Tests high-contrast color schemes and different escape syntax formats.

# Basic console colors (Cyan primary text, Magenta network interfaces):
color_basic                = "\e[96m"
color_network              = '\033[95m'
color_prefix               = \x1b[93m
color_inactive             = \e[90m
color_none                 = \e[0m

# Battery status colors:
color_battery_full         = \e[92m
color_battery_charging     = \033[96m
color_battery_not_charging = \x1b[37m
color_battery_discharging  = \e[91m

# Disk utilization threshold colors (Blue normal, Yellow warning, Red alert):
color_disk_normal          = \e[94m
color_disk_80percent       = \033[93m
color_disk_95percent       = \x1b[91m
